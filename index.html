<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>«Собрать по частям» — Технические работы</title>
  <!-- Подключаем красивый стильный шрифт с Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
      overflow: hidden;
      position: relative;
    }

    /* Фоновые декоративные свечения */
    .glow {
      position: absolute;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.25) 0%, rgba(0,0,0,0) 70%);
      border-radius: 50%;
      z-index: 1;
      animation: pulseGlow 6s infinite alternate ease-in-out;
    }

    .glow-1 { top: -50px; left: -50px; }
    .glow-2 { bottom: -50px; right: -50px; }

    @keyframes pulseGlow {
      0% { transform: scale(1); opacity: 0.5; }
      100% { transform: scale(1.3); opacity: 0.9; }
    }

    .container {
      position: relative;
      z-index: 2;
      max-width: 600px;
      width: 100%;
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 40px 24px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.4);
    }

    /* Анимация загрузки (неоновое кольцо) */
    .loader {
      width: 70px;
      height: 70px;
      border: 4px solid rgba(255, 255, 255, 0.1);
      border-left-color: #6366f1;
      border-right-color: #a855f7;
      border-radius: 50%;
      margin: 0 auto 24px;
      animation: spin 1.2s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .book-title {
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 3px;
      color: #a855f7;
      margin-bottom: 8px;
      font-weight: 600;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 800;
      margin-bottom: 12px;
      background: linear-gradient(to right, #ffffff, #cbd5e1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p {
      font-size: 0.95rem;
      color: #94a3b8;
      line-height: 1.6;
      margin-bottom: 30px;
    }

    /* Таймер */
    .timer {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .timer-block {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 12px;
      min-width: 65px;
    }

    .timer-val {
      font-size: 1.6rem;
      font-weight: 800;
      color: #f1f5f9;
      display: block;
    }

    .timer-lbl {
      font-size: 0.65rem;
      text-transform: uppercase;
      color: #64748b;
      letter-spacing: 1px;
      margin-top: 2px;
    }

    /* Кнопка управления музыкой */
    .audio-btn {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 10;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      padding: 10px 16px;
      border-radius: 30px;
      font-size: 0.85rem;
      cursor: pointer;
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.3s ease;
    }

    .audio-btn:hover {
      background: rgba(255, 255, 255, 0.15);
    }
  </style>
</head>
<body>

  <div class="glow glow-1"></div>
  <div class="glow glow-2"></div>

  <!-- Кнопка музыки -->
  <button class="audio-btn" id="musicBtn" onclick="toggleMusic()">
    🎵 Включить музыку
  </button>

  <!-- Тег аудиоплеера (ссылка на фоновую музыку) -->
  <audio id="bgMusic" loop>
    <!-- Замените ссылку ниже на любую свою прямую ссылку на mp3 файл -->
    <source src="https://mp3tourl.com/audio/1791550200566-a0a4e73c-24c7-4209-a812-b6cb3fa5af61.m4a" type="audio/mpeg">
  </audio>

  <div class="container">
    <div class="loader"></div>
    <div class="book-title">«Собрать по частям» — Andersen</div>
    <h1>Технические работы</h1>
    <p>Сайт книги находится в процессе настройки и оформления. Скоро здесь появятся первые главы!</p>

    <!-- Блок обратного отсчета -->
    <div class="timer">
      <div class="timer-block">
        <span class="timer-val" id="days">00</span>
        <span class="timer-lbl">Дней</span>
      </div>
      <div class="timer-block">
        <span class="timer-val" id="hours">00</span>
        <span class="timer-lbl">Часов</span>
      </div>
      <div class="timer-block">
        <span class="timer-val" id="minutes">00</span>
        <span class="timer-lbl">Мин</span>
      </div>
      <div class="timer-block">
        <span class="timer-val" id="seconds">00</span>
        <span class="timer-lbl">Сек</span>
      </div>
    </div>
  </div>

  <script>
    // ========================================================
    // НАСТРОЙКА ДАТЫ ЗАВЕРШЕНИЯ (Редактируйте строку ниже):
    // Формат: "YYYY-MM-DDTHH:MM:SS" (Год-Месяц-День T Часы:Минуты:Секунды)
    // ========================================================
    const targetDate = new Date("2026-10-15T18:00:00").getTime();

    function updateTimer() {
      const now = new Date().getTime();
      const diff = targetDate - now;

      if (diff <= 0) {
        document.querySelector('.timer').innerHTML = "<b style='color:#a855f7;'>Технические работы завершены!</b>";
        return;
      }

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((diff % (1000 * 60)) / 1000);

      document.getElementById('days').innerText = days < 10 ? '0' + days : days;
      document.getElementById('hours').innerText = hours < 10 ? '0' + hours : hours;
      document.getElementById('minutes').innerText = minutes < 10 ? '0' + minutes : minutes;
      document.getElementById('seconds').innerText = seconds < 10 ? '0' + seconds : seconds;
    }

    setInterval(updateTimer, 1000);
    updateTimer();

    // Управление музыкой
    const music = document.getElementById('bgMusic');
    const btn = document.getElementById('musicBtn');

    function toggleMusic() {
      if (music.paused) {
        music.play();
        btn.innerText = "🔊 Выключить музыку";
      } else {
        music.pause();
        btn.innerText = "🎵 Включить музыку";
      }
    }
  </script>
</body>
          </html>
