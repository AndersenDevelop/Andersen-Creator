<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>«Собрать по частям» — Технические работы</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
      position: relative;
    }

    .glow {
      position: absolute;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.25) 0%, rgba(0,0,0,0) 70%);
      border-radius: 50%;
      z-index: 1;
      animation: pulseGlow 6s infinite alternate ease-in-out;
    }

    .glow-1 { top: -50px; left: -50px; }
    .glow-2 { bottom: -50px; right: -50px; }

    @keyframes pulseGlow {
      0% { transform: scale(1); opacity: 0.5; }
      100% { transform: scale(1.3); opacity: 0.9; }
    }

    .container {
      position: relative;
      z-index: 2;
      max-width: 500px;
      width: 100%;
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 30px 20px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.4);
    }

    .loader {
      width: 60px;
      height: 60px;
      border: 4px solid rgba(255, 255, 255, 0.1);
      border-left-color: #6366f1;
      border-right-color: #a855f7;
      border-radius: 50%;
      margin: 0 auto 20px;
      animation: spin 1.2s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .book-title {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 3px;
      color: #a855f7;
      margin-bottom: 8px;
      font-weight: 600;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 800;
      margin-bottom: 12px;
      background: linear-gradient(to right, #ffffff, #cbd5e1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p {
      font-size: 0.9rem;
      color: #94a3b8;
      line-height: 1.5;
      margin-bottom: 24px;
    }

    .timer {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 24px;
    }

    .timer-block {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 10px;
      min-width: 60px;
    }

    .timer-val {
      font-size: 1.4rem;
      font-weight: 800;
      color: #f1f5f9;
      display: block;
    }

    .timer-lbl {
      font-size: 0.6rem;
      text-transform: uppercase;
      color: #64748b;
      letter-spacing: 1px;
      margin-top: 2px;
    }

    .audio-btn {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 10;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      padding: 10px 16px;
      border-radius: 30px;
      font-size: 0.85rem;
      cursor: pointer;
      backdrop-filter: blur(10px);
    }

    /* БЛОК ЧАТА */
    .chat-box {
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 15px;
      text-align: left;
    }

    .chat-title {
      font-size: 0.85rem;
      font-weight: 600;
      color: #a855f7;
      margin-bottom: 10px;
      text-align: center;
    }

    .chat-messages {
      height: 140px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-right: 5px;
      margin-bottom: 12px;
    }

    .chat-msg {
      font-size: 0.8rem;
      background: rgba(255, 255, 255, 0.05);
      padding: 8px 12px;
      border-radius: 10px;
      line-height: 1.4;
      word-break: break-word;
    }

    .chat-msg .author {
      font-weight: 600;
      color: #6366f1;
      margin-right: 6px;
    }

    .chat-inputs {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .chat-inputs input {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      padding: 8px 12px;
      color: #fff;
      font-size: 0.8rem;
      outline: none;
      font-family: inherit;
    }

    .chat-inputs button {
      background: linear-gradient(135deg, #6366f1, #a855f7);
      border: none;
      border-radius: 8px;
      padding: 8px;
      color: #fff;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="glow glow-1"></div>
  <div class="glow glow-2"></div>

  <button class="audio-btn" id="musicBtn" onclick="toggleMusic()">
    🎵 Включить музыку
  </button>

  <audio id="bgMusic" loop>
    <source src="https://mp3tourl.com/audio/1791550200566-a0a4e73c-24c7-4209-a812-b6cb3fa5af61.m4a" type="audio/mpeg">
  </audio>

  <div class="container">
    <div class="loader"></div>
    <div class="book-title">«Собрать по частям» — Andersen</div>
    <h1>Технические работы</h1>
    <p>Сайт книги находится в процессе настройки. Делитесь ожиданиями в чате ниже!</p>

    <div class="timer">
      <div class="timer-block"><span class="timer-val" id="days">00</span><span class="timer-lbl">Дней</span></div>
      <div class="timer-block"><span class="timer-val" id="hours">00</span><span class="timer-lbl">Часов</span></div>
      <div class="timer-block"><span class="timer-val" id="minutes">00</span><span class="timer-lbl">Мин</span></div>
      <div class="timer-block"><span class="timer-val" id="seconds">00</span><span class="timer-lbl">Сек</span></div>
    </div>

    <!-- Встроенный чат -->
    <div class="chat-box">
      <div class="chat-title">💬 Чат ожидания</div>
      <div class="chat-messages" id="chatMessages">
        <div class="chat-msg"><span class="author">Andersen:</span>Добро пожаловать! Скоро здесь появятся новые главы.</div>
      </div>
      <div class="chat-inputs">
        <input type="text" id="usernameInput" placeholder="Ваше имя / ник" value="Читатель">
        <div style="display:flex; gap:6px;">
          <input type="text" id="messageInput" placeholder="Напишите сообщение..." style="flex:1;">
          <button onclick="sendMessage()">Отправить</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Таймер
    const targetDate = new Date("2026-10-15T18:00:00").getTime();

    function updateTimer() {
      const now = new Date().getTime();
      const diff = targetDate - now;

      if (diff <= 0) {
        document.querySelector('.timer').innerHTML = "<b style='color:#a855f7;'>Работы завершены!</b>";
        return;
      }

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((diff % (1000 * 60)) / 1000);

      document.getElementById('days').innerText = days < 10 ? '0' + days : days;
      document.getElementById('hours').innerText = hours < 10 ? '0' + hours : hours;
      document.getElementById('minutes').innerText = minutes < 10 ? '0' + minutes : minutes;
      document.getElementById('seconds').innerText = seconds < 10 ? '0' + seconds : seconds;
    }

    setInterval(updateTimer, 1000);
    updateTimer();

    // Музыка
    const music = document.getElementById('bgMusic');
    const btn = document.getElementById('musicBtn');

    function toggleMusic() {
      if (music.paused) {
        music.play();
        btn.innerText = "🔊 Выключить музыку";
      } else {
        music.pause();
        btn.innerText = "🎵 Включить музыку";
      }
    }

    // Отправка сообщений в чат
    function sendMessage() {
      const nameInput = document.getElementById('usernameInput');
      const msgInput = document.getElementById('messageInput');
      const chatBox = document.getElementById('chatMessages');

      const name = nameInput.value.trim() || 'Аноним';
      const text = msgInput.value.trim();

      if (text !== "") {
        const msgDiv = document.createElement('div');
        msgDiv.className = 'chat-msg';
        msgDiv.innerHTML = `<span class="author">${name}:</span>${text}`;
        chatBox.appendChild(msgDiv);
        msgInput.value = "";
        chatBox.scrollTop = chatBox.scrollHeight;
      }
    }
  </script>
</body>
</html>
